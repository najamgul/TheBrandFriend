name: Blog pipeline — generate

# Generation runs here rather than on Vercel: a full draft -> polish -> judge
# cycle measures ~4-5 minutes, which exceeds Vercel's Hobby function limit
# (60s) and leaves no headroom against Pro's 300s ceiling.
#
# Publishing stays on Vercel Cron (see vercel.json) because it is fast and
# needs Next's revalidatePath.

on:
  schedule:
    # 02:30 UTC daily (08:00 IST). The pipeline no-ops once the content bank
    # holds CONTENT_BANK_TARGET approved articles, so a daily run is cheap.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate even if the content bank is full'
        type: boolean
        default: false

# Never let two runs claim the same topic concurrently.
concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NODE_OPTIONS: --no-warnings=MODULE_TYPELESS_PACKAGE_JSON
        run: |
          node scripts/blog-pipeline.mjs generate \
            ${{ inputs.force && '--force' || '' }}
