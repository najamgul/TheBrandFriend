name: Blog pipeline — generate (manual fallback)

# The scheduled generator runs on Vercel Cron (see vercel.json). This workflow
# is deliberately manual-only — a second schedule would race the Vercel one.
#
# Use it when a Vercel run aborts on its time budget. A typical run is ~186s
# against Vercel Pro's 300s ceiling, so a slow Replicate response or a JSON
# repair retry can exhaust it. Here there is no meaningful limit.
#
# It writes straight to Supabase, exactly as the Vercel route does, so an
# article generated here is picked up by the normal publish cron.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate even if the content bank is full'
        type: boolean
        default: false

# Never let two runs claim the same topic concurrently.
concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NODE_OPTIONS: --no-warnings=MODULE_TYPELESS_PACKAGE_JSON
        # github.event.inputs is readable on every trigger; dispatch booleans
        # arrive as the strings "true"/"false".
        run: |
          node scripts/blog-pipeline.mjs generate ${{ github.event.inputs.force == 'true' && '--force' || '' }}
