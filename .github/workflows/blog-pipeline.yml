name: Blog pipeline — generate (manual fallback)

# The scheduled generator runs as a Cloudflare Cron Trigger (see the crons in
# wrangler.jsonc, dispatched by worker.ts). This workflow is deliberately
# manual-only — a second schedule would race the Worker's.
#
# Use it when a Worker run aborts on its time budget. Cloudflare stops a cron
# invocation at 15 minutes and the route budgets itself to 600s, so a very slow
# Replicate response or a JSON repair retry can still exhaust it. Here there is
# no meaningful limit.
#
# It writes straight to Supabase, exactly as the Worker route does, so an
# article generated here is picked up by the normal publish cron.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate even if the content bank is full'
        type: boolean
        default: false

# Never let two runs claim the same topic concurrently.
concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NODE_OPTIONS: --no-warnings=MODULE_TYPELESS_PACKAGE_JSON
        # github.event.inputs is readable on every trigger; dispatch booleans
        # arrive as the strings "true"/"false".
        run: |
          node scripts/blog-pipeline.mjs generate ${{ github.event.inputs.force == 'true' && '--force' || '' }}
